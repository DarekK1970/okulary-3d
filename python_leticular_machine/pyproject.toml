[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lenticular-machine"
version = "0.1.0"
description = "External processing worker for Okulary 3D"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[project.scripts]
lenticular-worker = "lenticular_machine.cli:worker_main"
lenticular-api = "lenticular_machine.cli:api_main"

[tool.hatch.build.targets.wheel]
packages = ["src/lenticular_machine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

